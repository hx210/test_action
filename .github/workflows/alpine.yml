name: Release1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hx210/abuild-releaser-action@main
        with:
          author: r <r@r.com>
          rsa_public_key: ${{ secrets.RSA_PUBLIC_KEY }}
          rsa_private_key: ${{ secrets.RSA_PRIVATE_KEY }}
      - name: Upload Toolchain Image To Release
        uses: ncipollo/release-action@v1
        with:
          name: t
          allowUpdates: true
          replacesArtifacts: true
          tag: t
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./*